name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preventivatore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install openpyxl

      - name: Rigenera il seed dal file Excel e verifica che sia allineato
        run: |
          python scripts/etl.py
          git diff --exit-code -- src/data supabase/seed.sql || \
            (echo "::error::seed non allineato: eseguire 'python preventivatore/scripts/etl.py' e committare" && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: preventivatore/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
